<div id="ivui_settings" class="ivui-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-box-open"></i> Inventory UI</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="ivui-settings-buttons">
                <div id="ivui_open" class="menu_button menu_button_icon"><i class="fa-solid fa-box-open"></i><span data-ivui-t="open_btn"></span></div>
                <div id="ivui_rescan" class="menu_button menu_button_icon"><i class="fa-solid fa-rotate"></i><span data-ivui-t="rescan_btn"></span></div>
                <div id="ivui_scan_history" class="menu_button menu_button_icon"><i class="fa-solid fa-book-open"></i><span data-ivui-t="history_btn"></span></div>
            </div>

            <h4 data-ivui-t="set_general"></h4>
            <label class="checkbox_label" for="ivui_enabled"><input id="ivui_enabled" type="checkbox"><span data-ivui-t="set_enabled"></span></label>
            <label for="ivui_owners" data-ivui-t="set_owners"></label>
            <select id="ivui_owners" class="text_pole">
                <option value="char" data-ivui-t="set_owners_char"></option>
                <option value="user" data-ivui-t="set_owners_user"></option>
                <option value="both" data-ivui-t="set_owners_both"></option>
            </select>
            <label for="ivui_language" data-ivui-t="set_language"></label>
            <select id="ivui_language" class="text_pole">
                <option value="auto" data-ivui-t="set_lang_auto"></option>
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>

            <hr class="sysHR">
            <h4 data-ivui-t="set_tracker"></h4>
            <label for="ivui_profile" data-ivui-t="set_profile"></label>
            <select id="ivui_profile" class="text_pole"></select>
            <small class="ivui-settings-hint" data-ivui-t="set_profile_hint"></small>
            <small id="ivui_profile_missing" class="ivui-settings-warn" data-ivui-t="set_profile_missing" hidden></small>

            <label class="checkbox_label" for="ivui_auto"><input id="ivui_auto" type="checkbox"><span data-ivui-t="set_auto"></span></label>
            <label class="checkbox_label" for="ivui_greeting"><input id="ivui_greeting" type="checkbox"><span data-ivui-t="set_greeting"></span></label>
            <label class="checkbox_label" for="ivui_on_edit"><input id="ivui_on_edit" type="checkbox"><span data-ivui-t="set_on_edit"></span></label>
            <label class="checkbox_label" for="ivui_wait"><input id="ivui_wait" type="checkbox"><span data-ivui-t="set_wait"></span></label>

            <div class="ivui-settings-grid">
                <label for="ivui_every" data-ivui-t="set_every"></label>
                <input id="ivui_every" class="text_pole" type="number" min="1" max="50" step="1">
                <label for="ivui_max_new" data-ivui-t="set_max_new"></label>
                <input id="ivui_max_new" class="text_pole" type="number" min="1" max="20" step="1">
                <label for="ivui_context" data-ivui-t="set_context"></label>
                <input id="ivui_context" class="text_pole" type="number" min="0" max="10" step="1">
                <label for="ivui_history" data-ivui-t="set_history"></label>
                <input id="ivui_history" class="text_pole" type="number" min="2" max="300" step="1">
                <label for="ivui_max_tokens" data-ivui-t="set_max_tokens"></label>
                <input id="ivui_max_tokens" class="text_pole" type="number" min="100" max="8000" step="50">
                <label for="ivui_wait_timeout" data-ivui-t="set_wait_timeout"></label>
                <input id="ivui_wait_timeout" class="text_pole" type="number" min="5" max="600" step="5">
            </div>

            <div class="ivui-settings-row">
                <label for="ivui_tracker_prompt" data-ivui-t="set_tracker_prompt"></label>
                <div id="ivui_tracker_prompt_reset" class="menu_button menu_button_icon"><i class="fa-solid fa-rotate-left"></i><span data-ivui-t="reset"></span></div>
            </div>
            <textarea id="ivui_tracker_prompt" class="text_pole textarea_compact" rows="8"></textarea>
            <small class="ivui-settings-hint" data-ivui-t="set_tracker_prompt_hint"></small>

            <hr class="sysHR">
            <h4 data-ivui-t="set_injection"></h4>
            <label class="checkbox_label" for="ivui_inject"><input id="ivui_inject" type="checkbox"><span data-ivui-t="set_inject"></span></label>
            <label class="checkbox_label" for="ivui_inject_desc"><input id="ivui_inject_desc" type="checkbox"><span data-ivui-t="set_inject_desc"></span></label>
            <div class="ivui-settings-grid">
                <label for="ivui_inject_position" data-ivui-t="set_position"></label>
                <select id="ivui_inject_position" class="text_pole">
                    <option value="1" data-ivui-t="set_pos_chat"></option>
                    <option value="0" data-ivui-t="set_pos_after"></option>
                    <option value="2" data-ivui-t="set_pos_before"></option>
                </select>
                <label for="ivui_inject_depth" data-ivui-t="set_depth"></label>
                <input id="ivui_inject_depth" class="text_pole" type="number" min="0" max="100" step="1">
                <label for="ivui_inject_role" data-ivui-t="set_role"></label>
                <select id="ivui_inject_role" class="text_pole">
                    <option value="0" data-ivui-t="role_system"></option>
                    <option value="1" data-ivui-t="role_user"></option>
                    <option value="2" data-ivui-t="role_assistant"></option>
                </select>
            </div>
            <div class="ivui-settings-row">
                <label for="ivui_inject_template" data-ivui-t="set_template"></label>
                <div id="ivui_preview" class="menu_button menu_button_icon"><i class="fa-solid fa-eye"></i><span data-ivui-t="preview"></span></div>
                <div id="ivui_inject_template_reset" class="menu_button menu_button_icon"><i class="fa-solid fa-rotate-left"></i><span data-ivui-t="reset"></span></div>
            </div>
            <textarea id="ivui_inject_template" class="text_pole textarea_compact" rows="4"></textarea>
            <small class="ivui-settings-hint" data-ivui-t="set_template_hint"></small>

            <hr class="sysHR">
            <h4 data-ivui-t="set_interface"></h4>
            <label class="checkbox_label" for="ivui_hotbar"><input id="ivui_hotbar" type="checkbox"><span data-ivui-t="set_hotbar"></span></label>
            <label class="checkbox_label" for="ivui_toasts"><input id="ivui_toasts" type="checkbox"><span data-ivui-t="set_toasts"></span></label>
            <label class="checkbox_label" for="ivui_errors"><input id="ivui_errors" type="checkbox"><span data-ivui-t="set_errors"></span></label>
            <label class="checkbox_label" for="ivui_pixel_font"><input id="ivui_pixel_font" type="checkbox"><span data-ivui-t="set_pixel_font"></span></label>
            <label class="checkbox_label" for="ivui_confirm_delete"><input id="ivui_confirm_delete" type="checkbox"><span data-ivui-t="set_confirm_delete"></span></label>
            <div class="ivui-settings-grid">
                <label for="ivui_slot_size" data-ivui-t="set_slot_size"></label>
                <select id="ivui_slot_size" class="text_pole">
                    <option value="30" data-ivui-t="size_small"></option>
                    <option value="36" data-ivui-t="size_normal"></option>
                    <option value="44" data-ivui-t="size_large"></option>
                </select>
                <label for="ivui_bag_rows" data-ivui-t="set_bag_rows"></label>
                <input id="ivui_bag_rows" class="text_pole" type="number" min="1" max="12" step="1">
            </div>
        </div>
    </div>
</div>
